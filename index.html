    <script>
        // Apply theme immediately to prevent flash
        (function() {
            const theme = localStorage.getItem('theme');
            if (theme === 'dark') {
                document.documentElement.classList.add('dark-mode');
            } else if (theme === 'light') {
                // Do nothing, light mode is default
            } else {
                if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark-mode');
                }
            }
        })();
    </script>

    <script src="script.js"></script>
    <script>
    // Rising bubbles background
    (function() {
        const canvas = document.getElementById('bg-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function isDark() {
            return document.documentElement.classList.contains('dark-mode');
        }

        function makeParticle(fromBottom) {
            return {
                x: Math.random() * canvas.width,
                y: fromBottom ? canvas.height + Math.random() * 60 : Math.random() * canvas.height,
                r: Math.random() * 2.5 + 1.2,
                // Bubbles drift gently upward with a slow horizontal sway
                vx: (Math.random() - 0.5) * 0.12,
                vy: -(Math.random() * 0.14 + 0.05),
                sway: Math.random() * Math.PI * 2,
                swaySpeed: Math.random() * 0.008 + 0.002,
                alpha: Math.random() * 0.4 + 0.5,
                hue: Math.random() > 0.6 ? 185 : (Math.random() > 0.5 ? 200 : 217)
            };
        }

        function init() {
            resize();
            // Fewer, sparser bubbles so the background stays calm and unobtrusive
            const count = Math.min(55, Math.round(canvas.width / 28));
            particles = Array.from({ length: count }, () => makeParticle(false));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            const dark = isDark();

            // Draw bubbles rising slowly toward the surface
            particles.forEach(p => {
                p.sway += p.swaySpeed;
                p.x += p.vx + Math.sin(p.sway) * 0.15;
                p.y += p.vy;

                // Recycle bubbles that reach the top back to the bottom
                if (p.y < -20) {
                    p.y = canvas.height + Math.random() * 40;
                    p.x = Math.random() * canvas.width;
                }
                if (p.x < 0) p.x = canvas.width;
                if (p.x > canvas.width) p.x = 0;

                // Soft glow around each bubble
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = dark
                    ? `hsla(${p.hue}, 95%, 72%, ${p.alpha})`
                    : `hsla(${p.hue}, 75%, 48%, ${p.alpha})`;
                ctx.fill();

                // Subtle highlight ring to make it read as a bubble
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r + 1.4, 0, Math.PI * 2);
                ctx.strokeStyle = dark
                    ? `hsla(${p.hue}, 95%, 80%, ${p.alpha * 0.25})`
                    : `hsla(${p.hue}, 70%, 55%, ${p.alpha * 0.2})`;
                ctx.lineWidth = 1;
                ctx.stroke();
            });

            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);

        init();
        draw();
    })();
    </script>
